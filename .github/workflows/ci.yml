name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (web)
        run: npx tsc --noEmit
        working-directory: apps/web-client

      - name: Typecheck (llm)
        run: npm run typecheck --workspace=@starter/llm

      - name: Lint (web)
        run: npm run lint --workspace=@starter/web

      - name: Unit tests (llm)
        run: npm test --workspace=@starter/llm

      # Advisories that reach production traffic. Dev-only tooling
      # (vitest, drizzle-kit, the supabase CLI) is excluded deliberately —
      # it does not ship, and failing the build on it trains people to
      # ignore this step.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Production build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Placeholder credentials, deliberately fake.
      #
      # ClerkProvider needs a syntactically valid publishable key to prerender,
      # and the Supabase client needs a URL, so the build cannot run with these
      # unset. Using real secrets here would mean this job could never run on a
      # fork, and would put production credentials on a runner that has no need
      # for them.
      #
      # Nothing is contacted during a build: this validates compilation,
      # typechecking and prerendering, which is what we want CI to catch. It
      # does NOT validate that real configuration works, and it cannot. That is
      # what `npm run db:preflight` is for, run against a real environment.
      - name: Build
        run: npm run build:web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_placeholder_not_a_real_key
          SUPABASE_SERVICE_ROLE_KEY: ci_placeholder_not_a_real_key
