# ──────────────────────────────────────────────────────────────────────────
# LLM Prompt Service — Docker Compose
#
# Usage:
#   docker compose up              # start service + redis
#   docker compose up -d           # start in background
#   docker compose down            # stop everything
#   docker compose up --build      # rebuild and start
# ──────────────────────────────────────────────────────────────────────────

services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-prompt-service
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_FAST_MODEL=${OPENAI_FAST_MODEL:-gpt-4o-mini}
      - OPENAI_TIMEOUT_MS=${OPENAI_TIMEOUT_MS:-60000}
      - LLM_SERVICE_TOKEN=${LLM_SERVICE_TOKEN}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-crushie-local-dev}@redis:6379
      - REDIS_CACHE_TTL=${REDIS_CACHE_TTL:-3600}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-60}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
      - ELEVENLABS_OUTPUT_FORMAT=${ELEVENLABS_OUTPUT_FORMAT:-mp3_22050_32}
      - ELEVENLABS_OPTIMIZE_STREAMING_LATENCY=${ELEVENLABS_OPTIMIZE_STREAMING_LATENCY:-4}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - llm-network

  redis:
    image: redis:7-alpine
    container_name: llm-redis
    # Not published to the host. Cache keys embed real user ids alongside
    # AI-generated relationship narratives, and an unauthenticated Redis is
    # also a well-known RCE foothold via CONFIG SET dir + SAVE. The llm
    # service reaches it over the internal compose network by name.
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-crushie-local-dev} --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - llm-network

volumes:
  redis-data:

networks:
  llm-network:
    driver: bridge
